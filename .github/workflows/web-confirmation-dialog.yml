name: Themed confirmation dialog
on:
  pull_request:
    paths:
      - "FullWorth.Web/wwwroot/js/bff.js"
      - "FullWorth.Web/wwwroot/js/plaid-completion.js"
      - "FullWorth.Web/wwwroot/js/confirmation-dialog.js"
      - "FullWorth.Web/wwwroot/confirmation-dialog.css"
      - "FullWorth.Web/wwwroot/theme.css"
      - "FullWorth.Web/Components/App.razor"
      - "FullWorth.Web/Components/Pages/App/Account.razor"
      - "FullWorth.VisualTests/**"
      - ".github/workflows/web-confirmation-dialog.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: confirmation-dialog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Chromium and WebKit confirmation regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned browser test dependencies
        working-directory: FullWorth.VisualTests
        run: npm install --ignore-scripts --no-package-lock
      - name: Use signed Ubuntu archive for isolated browser dependencies
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("/etc/apt/sources.list"), Path("/etc/apt/apt-mirrors.txt")]
          sources = Path("/etc/apt/sources.list.d")
          candidates += sorted(sources.glob("*.list"))
          candidates += sorted(sources.glob("*.sources"))
          changed = 0
          for mirror_file in candidates:
              if not mirror_file.is_file():
                  continue
              original = mirror_file.read_text()
              updated = re.sub(r"https?://azure[.]archive[.]ubuntu[.]com/ubuntu",
                               "https://archive.ubuntu.com/ubuntu", original)
              if updated != original:
                  mirror_file.write_text(updated)
                  changed += 1
          print(f"Updated {changed} ephemeral runner Ubuntu mirror files; signing configuration preserved.")
          PY
      - name: Install browser engines
        working-directory: FullWorth.VisualTests
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise actual dialog and BFF modules in isolated fixture
        run: node FullWorth.VisualTests/confirmation-dialog.test.mjs
      - name: Verify BFF response contracts and explicit retry boundaries
        run: node FullWorth.VisualTests/bff-response-boundary.test.mjs
      - name: Verify explicit fresh-Link recovery and no silent replay
        run: node FullWorth.VisualTests/hosted-link-recovery.test.mjs
      - name: Retain synthetic mobile screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: confirmation-dialog-${{ github.sha }}
          path: FullWorth.VisualTests/artifacts/confirmation/
          if-no-files-found: warn
          retention-days: 7
