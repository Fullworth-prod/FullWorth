version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    # .NET 11 is a coordinated migration, not a release maintenance update.
    # Continue evaluating and applying .NET 10 patch/minor and security updates.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types:
          - "version-update:semver-major"
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "dotnet/aspnet"
        update-types:
          - "version-update:semver-major"
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/deploy/backup"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:35"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:40"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    groups:
      non-major-updates:
        update-types:
          - "minor"
          - "patch"
