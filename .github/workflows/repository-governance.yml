name: FullWorth Repository Governance

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - development
    paths:
      - .github/workflows/repository-governance.yml
      - deploy/verify-github-branch-governance.sh
      - deploy/tests/repository-governance-workflow-tests.sh
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: fullworth-repository-governance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-protected-branches:
    name: Verify protected branches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify master and development protection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash deploy/verify-github-branch-governance.sh
